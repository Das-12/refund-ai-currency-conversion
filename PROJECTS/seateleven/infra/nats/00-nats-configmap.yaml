apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: infra
data:
  nats.conf: |
    # Cluster configuration
    # Cluster configuration
    cluster {
      name: nats-cluster
      listen: 0.0.0.0:6222
      # For single node or dynamic mesh, we can omit explicit routes or use auto-discovery sidecars.
      # For now, to fix the crash with 1 replica, we remove the static routes to missing pods.
      routes: []
    }

    # JetStream configuration
    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 1Gi
      max_file_store: 10Gi
    }

    # Logging
    debug: false
    trace: false
    logtime: true

    # PID file
    pid_file: "/var/run/nats/nats.pid"
    
    # HTTP monitoring port
    http: 8222
