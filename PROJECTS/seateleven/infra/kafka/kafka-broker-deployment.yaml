
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker
  namespace: infra
  labels:
    app: kafka-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /kafka-logs && rm -f /kafka-logs/meta.properties"]
        volumeMounts:
        - mountPath: /kafka-logs
          name: kafka-storage
      containers:
      - name: kafka-broker
        image: wurstmeister/kafka
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
          protocol: TCP
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper-service:2181
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-service.infra.svc.cluster.local:9092
        - name: KAFKA_ADVERTISED_HOST_NAME
          value: kafka-service
        - name: KAFKA_LOG_DIRS
          value: /kafka-logs
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx1024M -Xms512M"
        resources: {}
        volumeMounts:
        - mountPath: /kafka-logs
          name: kafka-storage
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: kafka-storage
        persistentVolumeClaim:
          claimName: kafka-pvc