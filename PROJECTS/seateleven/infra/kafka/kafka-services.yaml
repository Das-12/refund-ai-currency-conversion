apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: infra
  labels:
    app: kafka-broker
spec:
  type: ClusterIP
  ports:
  - name: kafka
    port: 9092
    protocol: TCP
    targetPort: 9092
  selector:
    app: kafka-broker
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: infra
  labels:
    app: zookeeper-service
spec:
  type: NodePort
  ports:
  - name: zookeeper-port
    port: 2181
    protocol: TCP
    targetPort: 2181
    nodePort: 30181
  selector:
    app: zookeeper