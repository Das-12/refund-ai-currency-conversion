apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: infra
spec:
  # 2:00 AM IST = 20:30 UTC
  schedule: "30 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:15
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: postgres-password
                - name: TZ
                  value: Asia/Kolkata
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  BACKUP_DIR="/backups/postgres"
                  mkdir -p "$BACKUP_DIR"
                  BACKUP_FILE="$BACKUP_DIR/postgres-all-$(date +%Y-%m-%d).sql.gz"
                  echo "[$(date)] Starting PostgreSQL backup..."
                  pg_dumpall \
                    --host=postgres.infra.svc.cluster.local \
                    --port=5432 \
                    --username=postgres \
                    | gzip > "$BACKUP_FILE"
                  echo "[$(date)] Removing backups older than 30 days..."
                  find "$BACKUP_DIR" -name "*.sql.gz" -mtime +30 -delete
                  echo "[$(date)] PostgreSQL backup completed: $BACKUP_FILE"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: db-backups-pvc
