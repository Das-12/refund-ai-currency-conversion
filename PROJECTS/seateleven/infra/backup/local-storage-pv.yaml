apiVersion: v1
kind: PersistentVolume
metadata:
  name: db-backups-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 900Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ecogo
